name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Rust Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude splat-desktop --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --exclude splat-desktop --all-targets

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global ajv-cli
      - run: ajv validate --spec=draft2020 --strict=false -s schemas/preset.schema.json -d "presets/*.json"
      - run: ajv validate --spec=draft2020 --strict=false -s schemas/project.schema.json -d schemas/examples/project.valid.json
      - run: ajv validate --spec=draft2020 --strict=false -s schemas/event.schema.json -d schemas/examples/event.valid.json
      - name: Reject invalid project fixture
        run: |
          if ajv validate --spec=draft2020 --strict=false -s schemas/project.schema.json -d schemas/examples/project.invalid.json; then
            echo "Expected invalid project fixture to be rejected"
            exit 1
          fi

  windows-baseline:
    name: Windows Baseline
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: pnpm --dir apps/desktop tauri build --debug --no-bundle
