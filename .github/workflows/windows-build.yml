name: Windows Full Internal Installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-full-internal-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-full:
    name: Build unsigned internal Windows installer
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - uses: pnpm/action-setup@v5
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Cargo target directory
        id: cargo-metadata
        shell: powershell
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          "target_dir=$($metadata.target_directory)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build full offline installer
        run: pnpm package:windows:full

      - name: Verify internal artifact set
        shell: powershell
        run: |
          $bundle = Join-Path '${{ steps.cargo-metadata.outputs.target_dir }}' 'release/bundle/nsis'
          $setup = Join-Path $bundle 'MetOrigin-Splat-Full-Setup-0.1.0-internal.exe'
          $sums = Join-Path $bundle 'SHA256SUMS.txt'
          $manifest = Join-Path $bundle 'metadata/engine-manifest.json'
          $notices = Join-Path $bundle 'metadata/THIRD_PARTY_NOTICES.md'
          foreach ($path in @($setup, $sums, $manifest, $notices)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected internal artifact is missing: $path"
            }
          }
          $expected = ((Get-Content -LiteralPath $sums -Raw) -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "Installer SHA-256 does not match SHA256SUMS.txt"
          }

      - name: Upload unsigned internal installer
        uses: actions/upload-artifact@v4
        with:
          name: MetOrigin-Splat-Full-Setup-0.1.0-internal
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            ${{ steps.cargo-metadata.outputs.target_dir }}/release/bundle/nsis/MetOrigin-Splat-Full-Setup-0.1.0-internal.exe
            ${{ steps.cargo-metadata.outputs.target_dir }}/release/bundle/nsis/SHA256SUMS.txt
            ${{ steps.cargo-metadata.outputs.target_dir }}/release/bundle/nsis/metadata/**
