name: Feature request
description: Propose a focused improvement to MetOrigin Splat
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user problem before proposing an implementation. Large engine, project-format, or architecture changes should begin with a design discussion.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior without assuming a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workflows, workarounds, or other designs you considered.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and scope
      description: Note expected OS, GPU, engine, project-format, privacy, or migration impact.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request does not depend on redistributing unreviewed third-party binaries, model weights, or datasets.
          required: true
